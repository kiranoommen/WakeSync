<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="360" viewBox="0 0 1300 360" role="img" aria-labelledby="title desc">
  <title id="title">WakeSync smart wake fallback flow</title>
  <desc id="desc">Three layers: live sleep, predictive history, and guaranteed hard stop.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#080D1F"/><stop offset="1" stop-color="#171E36"/></linearGradient>
    <linearGradient id="arrow" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#6F63FF"/><stop offset=".55" stop-color="#9A84FF"/><stop offset="1" stop-color="#FFB44A"/></linearGradient>
  </defs>
  <rect width="1300" height="360" rx="28" fill="url(#bg)"/>
  <text x="58" y="62" fill="#F7F8FF" font-family="Inter,Roboto,Arial,sans-serif" font-size="30" font-weight="700">Smart Wake fallback ladder</text>
  <text x="58" y="98" fill="#AEB7D4" font-family="Inter,Roboto,Arial,sans-serif" font-size="18">Use the best signal available. Never lose the deadline.</text>
  <g font-family="Inter,Roboto,Arial,sans-serif">
    <g transform="translate(58 132)"><rect width="330" height="160" rx="24" fill="#6F63FF" opacity=".18" stroke="#756CFF" stroke-width="2"/><text x="28" y="42" fill="#9A84FF" font-size="16" font-weight="700">LAYER 1</text><text x="28" y="79" fill="#F7F8FF" font-size="28" font-weight="700">Live sleep</text><text x="28" y="112" fill="#AEB7D4" font-size="17">Fresh Awake / Light stages</text><text x="28" y="138" fill="#AEB7D4" font-size="17">inside the allowed window</text></g>
    <g transform="translate(486 132)"><rect width="330" height="160" rx="24" fill="#9A84FF" opacity=".16" stroke="#A08BFF" stroke-width="2"/><text x="28" y="42" fill="#B6A7FF" font-size="16" font-weight="700">LAYER 2 · FINAL 10M</text><text x="28" y="79" fill="#F7F8FF" font-size="28" font-weight="700">Predictive history</text><text x="28" y="112" fill="#AEB7D4" font-size="17">Historical fallback is armed</text><text x="28" y="138" fill="#AEB7D4" font-size="17">while live monitoring stays active</text></g>
    <g transform="translate(914 132)"><rect width="330" height="160" rx="24" fill="#FFB44A" opacity=".14" stroke="#FFB44A" stroke-width="2"/><text x="28" y="42" fill="#FFD17A" font-size="16" font-weight="700">LAYER 3</text><text x="28" y="79" fill="#F7F8FF" font-size="28" font-weight="700">Hard stop</text><text x="28" y="112" fill="#E1D7C3" font-size="17">Independent alarm scheduled</text><text x="28" y="138" fill="#E1D7C3" font-size="17">for the user's deadline</text></g>
  </g>
  <path d="M400 212 H468" stroke="url(#arrow)" stroke-width="7" stroke-linecap="round"/><path d="M456 200 L472 212 L456 224" fill="none" stroke="#9A84FF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M828 212 H896" stroke="url(#arrow)" stroke-width="7" stroke-linecap="round"/><path d="M884 200 L900 212 L884 224" fill="none" stroke="#FFB44A" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
</svg>